<!doctype html>
<meta charset="utf-8">
<title>ragequit</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #shot { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
<body>
<img id="shot" alt="">
<script>
  // Show the frozen desktop, then arm the engine on top of it.
  const D = window.__SMASH_DESKTOP__;
  Promise.all([D.shot(), D.info().catch(() => ({ platform: 'desktop' }))]).then(([url, info]) => {
    document.getElementById('shot').src = url;
    window.__SMASH_HOST__ = {
      // save-the-carnage backdrop = the frozen screenshot (already clean of our UI)
      capture: () => Promise.resolve(url),
      info: info,
      openMail: (u) => D.mail(u), // main validates + hands it to the OS mail app
    };
    const s = document.createElement('script');
    s.src = 'destroy.js';
    document.body.appendChild(s);
  }).catch(() => window.__SMASH_DESKTOP__.quit()); // never strand a fullscreen window without Esc
</script>
</body>
